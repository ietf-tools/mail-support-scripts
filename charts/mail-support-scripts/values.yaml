image:
  repository: ghcr.io/astral-sh/uv
  tag: python3.12-alpine
  pullPolicy: IfNotPresent

gitImage:
  repository: alpine/git
  tag: latest
  pullPolicy: IfNotPresent

scriptsRepo: git@github.com:ietf-tools/mail-support-scripts.git
scriptsRef: main

deployKey:
  secretName: mail-support-scripts-deploy-key

commonEnv: {}

dtAliasSync:
  enabled: true
  schedule: "*/15 * * * *"
  args: ["--apply"]
  env: {}
  secrets: []
  envFrom: []

globalAllowlistSync:
  enabled: true
  schedule: "0 * * * *"
  args: ["--apply"]
  env: {}
  secrets: []
  envFrom: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
